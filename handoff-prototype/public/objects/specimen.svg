<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="800" height="1000">
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0f2a33"/>
      <stop offset="0.55" stop-color="#071a21"/>
      <stop offset="1" stop-color="#04090d"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fff4" stop-opacity="0.75"/>
      <stop offset="0.4" stop-color="#63e6d6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#2aa3c9" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.47" r="0.5">
      <stop offset="0" stop-color="#41f2dc" stop-opacity="0.38"/>
      <stop offset="0.45" stop-color="#1ba4b8" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0a3040" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.25" stop-color="#b9fff5"/>
      <stop offset="0.6" stop-color="#3fe7d3" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1fb6c8" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="slab"><rect x="4" y="4" width="392" height="492" rx="34"/></clipPath>
  </defs>

  <rect x="4" y="4" width="392" height="492" rx="34" fill="url(#glass)"/>
  <g clip-path="url(#slab)">
    <rect width="400" height="500" fill="url(#aura)"/>
    <!-- faint measurement grid -->
    <g stroke="#7ff5e6" stroke-opacity="0.05" stroke-width="1">
      <path d="M0 90H400M0 150H400M0 210H400M0 270H400M0 330H400M0 390H400"/>
      <path d="M50 0V500M110 0V500M170 0V500M230 0V500M290 0V500M350 0V500"/>
    </g>

    <!-- holographic sphere -->
    <g transform="translate(200 236)" fill="none" stroke="#6ff3e2" stroke-width="1">
      <circle r="112" stroke-opacity="0.55"/>
      <ellipse rx="112" ry="26" stroke-opacity="0.35"/>
      <ellipse rx="112" ry="62" stroke-opacity="0.28"/>
      <ellipse rx="112" ry="94" stroke-opacity="0.2"/>
      <ellipse rx="26" ry="112" stroke-opacity="0.35"/>
      <ellipse rx="62" ry="112" stroke-opacity="0.28"/>
      <ellipse rx="94" ry="112" stroke-opacity="0.2"/>
      <g transform="rotate(-18)" filter="url(#glow)">
        <ellipse rx="164" ry="38" stroke="#aefcf2" stroke-opacity="0.75" stroke-width="1.4"/>
        <circle cx="156" cy="-12" r="3.2" fill="#e8fffb" stroke="none"/>
        <circle cx="-120" cy="26" r="2.2" fill="#9cf9ee" stroke="none"/>
      </g>
      <g transform="rotate(34)">
        <ellipse rx="138" ry="16" stroke="#3ccbe0" stroke-opacity="0.45" stroke-dasharray="2 6"/>
      </g>
      <circle r="58" fill="url(#core)" stroke="none"/>
      <g fill="#dffffa" stroke="none" filter="url(#glow)">
        <circle cx="-64" cy="-58" r="2"/>
        <circle cx="72" cy="40" r="2.4"/>
        <circle cx="30" cy="-96" r="1.6"/>
        <circle cx="-88" cy="54" r="1.6"/>
        <circle cx="0" cy="0" r="5"/>
      </g>
    </g>

    <!-- labels -->
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" fill="#bff9f1">
      <text x="32" y="52" font-size="12" letter-spacing="3.5" fill-opacity="0.8">SPECIMEN</text>
      <text x="368" y="52" font-size="12" letter-spacing="2" text-anchor="end" fill-opacity="0.45">01</text>
      <text x="32" y="428" font-size="22" font-weight="300" letter-spacing="1.5" fill="#effffd">Lumen Seed</text>
      <text x="32" y="456" font-size="10.5" letter-spacing="2.2" fill-opacity="0.5">412 NM  ·  PH 7.4  ·  STABLE</text>
    </g>
    <path d="M32 396H120" stroke="#6ff3e2" stroke-opacity="0.5"/>

    <rect width="400" height="500" fill="url(#sheen)"/>
  </g>
  <rect x="4.75" y="4.75" width="390.5" height="490.5" rx="33.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>
</svg>
